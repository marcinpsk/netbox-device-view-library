version: 2
updates:
  # Moves each pins/ commit to the head of the branch that .gitmodules names.
  # The pins follow branches under review here, so they move without a cooldown.
  - package-ecosystem: gitsubmodule # zizmor: ignore[dependabot-cooldown]
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(pins)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
