---
version: 1

meta:
  description: "Cisco Catalyst 8300-1N1S-6T"

canvas:
  columns: 22
  rows: 2

views:
  front:
    elements:
      - {kind: module-slot, key: "sm-1", label: "SM 1", at: {row: 1, col: 1}, span: {rows: 2, cols: 6}}
      - {kind: module-slot, key: "nim-1", label: "NIM 1", at: {row: 1, col: 8}, span: {rows: 2, cols: 8}}
      - {kind: interface, key: "gigabitethernet0-0", at: {row: 1, col: 17}}
      - {kind: interface, key: "gigabitethernet0-1", at: {row: 2, col: 17}}
      - {kind: interface, key: "gigabitethernet0-2", at: {row: 1, col: 18}}
      - {kind: interface, key: "gigabitethernet0-3", at: {row: 2, col: 18}}
      - {kind: interface, key: "gigabitethernet0-4", at: {row: 1, col: 20}}
      - {kind: interface, key: "gigabitethernet0-5", at: {row: 2, col: 20}}
      - {kind: console-port, key: "con0", label: "con", at: {row: 1, col: 22}}

variants:
  # NIM-16A in bay "NIM 1": console-server ports Async0/1/0 to Async0/1/15.
  NIM-16A:
    match: module
    view: front
    elements:
      - {kind: module-slot, key: "sm-1", label: "SM 1", at: {row: 1, col: 1}, span: {rows: 2, cols: 6}}
      # A label replaces the NIM 1 slot, because a port cannot cover a slot.
      - {kind: label, key: "nim-1", label: "NIM 1", at: {row: 1, col: 8}, span: {rows: 2, cols: 8}}
      - {kind: console-port, key: "async0-1-0", at: {row: 1, col: 8}}
      - {kind: console-port, key: "async0-1-1", at: {row: 1, col: 9}}
      - {kind: console-port, key: "async0-1-2", at: {row: 1, col: 10}}
      - {kind: console-port, key: "async0-1-3", at: {row: 1, col: 11}}
      - {kind: console-port, key: "async0-1-4", at: {row: 1, col: 12}}
      - {kind: console-port, key: "async0-1-5", at: {row: 1, col: 13}}
      - {kind: console-port, key: "async0-1-6", at: {row: 1, col: 14}}
      - {kind: console-port, key: "async0-1-7", at: {row: 1, col: 15}}
      - {kind: console-port, key: "async0-1-8", at: {row: 2, col: 8}}
      - {kind: console-port, key: "async0-1-9", at: {row: 2, col: 9}}
      - {kind: console-port, key: "async0-1-10", at: {row: 2, col: 10}}
      - {kind: console-port, key: "async0-1-11", at: {row: 2, col: 11}}
      - {kind: console-port, key: "async0-1-12", at: {row: 2, col: 12}}
      - {kind: console-port, key: "async0-1-13", at: {row: 2, col: 13}}
      - {kind: console-port, key: "async0-1-14", at: {row: 2, col: 14}}
      - {kind: console-port, key: "async0-1-15", at: {row: 2, col: 15}}
      - {kind: interface, key: "gigabitethernet0-0", at: {row: 1, col: 17}}
      - {kind: interface, key: "gigabitethernet0-1", at: {row: 2, col: 17}}
      - {kind: interface, key: "gigabitethernet0-2", at: {row: 1, col: 18}}
      - {kind: interface, key: "gigabitethernet0-3", at: {row: 2, col: 18}}
      - {kind: interface, key: "gigabitethernet0-4", at: {row: 1, col: 20}}
      - {kind: interface, key: "gigabitethernet0-5", at: {row: 2, col: 20}}
      - {kind: console-port, key: "con0", label: "con", at: {row: 1, col: 22}}
